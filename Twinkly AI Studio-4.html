<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twinkly AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--g:120,60,255}:root.kb{--sab:0px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Open Sans',system-ui,sans-serif;overflow:hidden}
body{position:fixed;inset:0;width:100%}
#app{height:var(--vh,100%);padding:var(--sat) 0 var(--sab);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#000;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex:none}
header h1{font-size:17px;font-weight:400;margin:0}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(58,60,72,.85);color:#fff;display:grid;place-items:center;cursor:pointer}
#stage{position:relative;flex:1 1 auto;min-height:0;transition:flex-basis .7s cubic-bezier(.2,.8,.2,1)}
#halo{position:absolute;inset:8% 6%;border-radius:50%;background:radial-gradient(circle,rgba(var(--g),.28),transparent 68%);filter:blur(30px);pointer-events:none}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#hero{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(22px,7vw,30px);font-weight:300;line-height:1.25;padding:0 22%;pointer-events:none;text-shadow:0 2px 20px rgba(20,0,60,.7);transition:opacity .5s}
.chatting #stage{flex:0 0 38%}
.kb #stage{flex:0 0 min(27%,200px)}
.kb #cards{display:none}
.kb #hero{font-size:15px;padding:0 24%}
.chatting #hero,.chatting #cards{opacity:0;pointer-events:none}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 14px;flex:none;transition:opacity .3s}
.chatting #cards{display:none}
.card{background:#22242f;border:0;border-radius:24px;color:#fff;padding:18px 14px;text-align:center;font:inherit;cursor:pointer;transition:transform .15s,background .2s}
.card:active{transform:scale(.97);background:#2c2f3d}
.card.wide{grid-column:1/3}
.card b{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:400;font-size:17px;margin-bottom:6px}
.card span{display:block;font-size:13.5px;line-height:1.3;color:#a9abb8;font-weight:300}
#chat{flex:0 0 0;overflow-y:auto;padding:0 20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 24px);mask-image:linear-gradient(transparent,#000 24px)}
.chatting #chat{flex:1 1 auto;padding-top:22px;padding-bottom:12px}
#chat::-webkit-scrollbar{display:none}
.u{white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-end;max-width:80%;background:#2d2d2f;border-radius:22px;padding:14px 18px;font-size:17px;line-height:1.35}
.a{max-width:82%;font-size:17px;line-height:1.4;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.a small{display:block;margin-top:10px;color:#b9a8e6;font-weight:300;font-size:15px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid rgba(160,130,255,.55);background:rgba(20,10,50,.5);color:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip:active{background:rgba(130,100,255,.4)}
.pv{display:block;width:230px;max-width:100%;border-radius:18px;margin-top:4px}
.dots{display:inline-flex;gap:5px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:#9d8cff;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
#bar{margin:4px 20px 14px;min-height:62px;border-radius:31px;border:1px solid rgba(180,170,255,.28);background:linear-gradient(180deg,rgba(60,62,78,.9),rgba(42,44,58,.9));display:flex;align-items:center;gap:8px;padding:9px 10px 9px 16px;flex:none}
#bar textarea{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px;font-weight:300;resize:none;max-height:110px;line-height:1.3;padding:8px 0;height:38px}
#bar textarea::placeholder{color:#9a9bab}
#bar button{background:none;border:0;color:#c9cad6;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
#bar button:focus-visible,.card:focus-visible,.chip:focus-visible,.ib:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
#send{border-radius:50%;background:linear-gradient(135deg,#7c5cff,#3b9cff)!important;color:#fff!important;display:none!important}
#bar.has #send{display:grid!important}#bar.has #mic{display:none}
#save{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:inherit;font-size:12px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#save.on{opacity:1;pointer-events:auto}
.a.dim{color:#8f8da3;font-weight:300}
.thumb{align-self:flex-end;border:3px solid #1c1b24;border-radius:16px;background:#1c1b24;padding:0;cursor:pointer;width:96px;overflow:hidden;line-height:0;display:block}
.a .thumb{margin-top:12px;width:110px}
.thumb canvas{width:100%;border-radius:12px;display:block}
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex}.ov.mid{align-items:center;padding:20px}
.sheet{width:100%;background:#000;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + var(--sab));text-align:center;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet i{display:block;width:40px;height:4px;border-radius:2px;background:#3a3a44;margin:0 auto 18px}
.sheet h2{font-size:18px;font-weight:400;margin:0 0 6px}.sheet p{margin:0 0 18px;color:#a9abb8;font-size:13px;font-weight:300}
.sheet button{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px;padding:18px 20px;border-radius:14px;border:0;background:#2a2736;color:#fff;font:inherit;font-size:16px;cursor:pointer}
.pvm{width:100%;background:#2b2a36;border-radius:20px;padding:16px;animation:up .3s ease}
.pvm div{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px}.pvm div button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 4px}
.pvm canvas{width:100%;border-radius:10px;display:block;background:#000}
.pvm small{display:block;margin-top:10px;color:#a9abb8;font-size:12px;font-weight:300}
#kbd{display:none;flex:none;background:#1c1c1e;padding:10px 4px 14px;user-select:none;-webkit-user-select:none;animation:up .25s ease}
.demo #kbd{display:block}
#kbd .r{display:flex;justify-content:center;gap:5px;margin-bottom:9px}
#kbd b{flex:1;max-width:34px;height:42px;border-radius:6px;background:#4a4a4d;color:#fff;font-weight:400;font-size:19px;display:grid;place-items:center;cursor:pointer}
#kbd b:active{background:#6a6a6e}
#kbd b.s{background:#2e2e30;max-width:46px;font-size:15px}#kbd b.w{max-width:none;flex:5;font-size:15px}
#bg{position:absolute;inset:0;z-index:0;display:none}#bg canvas{width:100%;height:100%;display:block}
.imgmode #bg{display:block}.imgmode #halo{opacity:.3}
header,#chat,#cards,#bar,#kbd{position:relative;z-index:1}#stage{z-index:1}
.imgmode .a{text-shadow:0 1px 14px rgba(0,0,0,.8)}
.dlimg{width:132px;height:132px;display:block;margin:6px auto 8px}
#dlOv{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.6));pointer-events:none}#dlOv .sheet{pointer-events:auto}
#save{display:none!important}
.sheet h3{font-size:14px;font-weight:400;margin:0}.sheet small{display:block;color:#a9abb8;font-size:12px;margin:2px 0 14px}
.sheet button.pri{background:linear-gradient(90deg,#ff5a3c,#ff3d5a);justify-content:center}.sheet button.sec{justify-content:center}.sheet button:disabled{opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"><canvas id="bgc"></canvas></div>
  <header>
    <button class="ib" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>AI Studio</h1>
    <button class="ib" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </header>
  <section id="stage"><div id="halo"></div><canvas id="gl"></canvas><div id="hero">Ready to create something magical?</div><button id="save">Save</button></section>
  <main id="chat" aria-live="polite"></main>
  <div id="cards">
    <button class="card wide" id="c-img"><b><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 17l4-7 3 5 2-3 3 5"/></svg>Scene Visualiser</b><span>Upload an image and use to create, visualize and apply an effect directly onto your scene</span></button>
    <button class="card" id="c-fx"><b><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>Effect Generator</b><span>Turn ideas into stunning visuals in seconds</span></button>
    <button class="card" id="c-mood"><b><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c-5 0-8-3-8-8 5 0 8 3 8 8zM12 20c5 0 8-3 8-8-5 0-8 3-8 8zM12 14c-2-2-2-6 0-9 2 3 2 7 0 9z"/></svg>Mood Creator</b><span>Create a scene based on a specific occasion &amp; space</span></button>
  </div>
  <div id="bar">
    <button id="plus" aria-label="Upload image"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>
    <textarea id="in" rows="1" maxlength="600" placeholder="Start creating…" aria-label="Message"></textarea>
    <button id="mic" aria-label="Voice"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div id="kbd" aria-hidden="true"></div>
  <input type="file" id="file" accept="image/*" hidden><input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <div class="ov" id="sheetOv"><div class="sheet" role="dialog" aria-label="Upload photos"><i></i><h2>Upload Photos</h2><p>Users can upload images from their device to the app.</p><button id="takeB">Take Photo<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button id="libB">Photo Library<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 17l4-7 3 5 2-3 3 5"/></svg></button></div></div>
  <div class="ov" id="dlOv"><div class="sheet" role="dialog" aria-label="Downloading effect"><i></i><h2>Downloading Effect</h2><p>Your download is in progress and you will see it in your gallery</p><canvas id="dlImg" class="dlimg" width="240" height="240" aria-label="Live effect preview"></canvas><h3 id="dlName"></h3><small>Created by You</small><button class="pri" id="addB">Add To My Gallery</button><button class="sec" id="cancB">Cancel</button></div></div>
  <div class="ov mid" id="pvOv"><div class="pvm" role="dialog" aria-label="Preview"><div><span>Preview</span><button id="pvX" aria-label="Close">×</button></div><canvas id="pvC"></canvas><small>Tap a ringed light to remove it, or tap the photo to add one I missed.</small></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Presets: colors top→bottom + glow, and effect motifs ---------- */
const PRE={
 aurora:{n:'Midnight aurora',d:'a drifting violet-to-blue nebula',c:['#1a0a6b','#b03fb8','#1a3fe0','#5ff0ff'],sun:0,sy:0,sp:0,sn:0,wv:0,k:['magic','aurora','galaxy','dream','night','movie','purple','default']},

 fire:{n:'Crispy Fire',d:'molten amber waves melting into a violet flame',c:['#260b04','#c2410c','#f59e0b','#ffb066'],sun:0,sy:0,sp:1,sn:0,wv:.5,px:30,k:['cozy','fireplace','fire','candle','hygge','ember']},
 halloween:{n:'Halloween',d:'a low orange moon, violet haze and drifting embers',c:['#12021f','#5b1a8a','#ff6a00','#ff8a1f'],sun:.8,sy:.28,sp:1,sn:0,wv:.3,k:['halloween','spooky','pumpkin','scary']},
 xmas:{n:'Christmas snow',d:'red and evergreen light with falling snow',c:['#0b3d2a','#b3122b','#ffd7d7','#ffffff'],sun:0,sy:0,sp:0,sn:1,wv:.2,px:26,k:['christmas','xmas','winter','snow','holiday']},
 ocean:{n:'Calm ocean',d:'cool teal water slowly rolling',c:['#031b3a','#0a6ea8','#22d3ee','#a5f3fc'],sun:0,sy:0,sp:0,sn:0,wv:1,k:['ocean','sea','calm','cool','water','relax','blue']},
 forest:{n:'Forest fireflies',d:'deep green light with floating fireflies',c:['#04150c','#146c43','#7ddc6f','#d9ff9a'],sun:0,sy:0,sp:.5,sn:0,wv:.3,k:['forest','green','nature','fresh','firefl']},
 romance:{n:'Romantic rose',d:'soft rose light with rising sparks',c:['#2a0a2e','#d1327a','#ff7aa8','#ffc4d8'],sun:.3,sy:-.4,sp:.5,sn:0,wv:.6,k:['romantic','love','valentine','date','pink','wedding','dinner']},
 party:{n:'Neon party',d:'electric magenta and cyan pulses',c:['#12002e','#ff2bd6','#22d3ee','#7cffea'],sun:0,sy:0,sp:.7,sn:0,wv:.8,px:24,k:['party','birthday','neon','disco','celebrat','fun']},
 diwali:{n:'Diwali gold',d:'golden lantern light with floating sparks',c:['#2b0a03','#e0561b','#ffc83d','#fff0a0'],sun:.4,sy:-.2,sp:1,sn:0,wv:.4,k:['diwali','festival','gold','lantern']},
 rainbow:{n:'Pixel rainbow',d:'a rolling LED rainbow',c:['#12002e','#ff2bd6','#22d3ee','#ffe14a'],sun:0,sy:0,sp:.2,sn:0,wv:.5,px:24,rn:1,k:['rainbow','pride','colorful','multicolor','pixel']},
 apocalypse:{n:'Halloween Apocalypse',d:'molten magenta and amber flames swirling inside the glass',c:['#2a0838','#c0267a','#ff7a1a','#ffd36b'],sun:.6,sy:-.42,sp:1,sn:0,wv:1,k:['apocalypse','inferno','lava','volcano','blaze','magma','doom']}
};
const SPACES=['kitchen','living room','bedroom','garden','patio','balcony','tree','window','bathroom','office','porch','dining room','room'];
const COLORS={red:'#ef2b3a',orange:'#ff7a1a',yellow:'#ffd21f',green:'#22c55e',teal:'#14b8a6',blue:'#2563eb',purple:'#8b3dff',pink:'#ff4fa3',white:'#f1f5f9',gold:'#ffc83d'};

/* ---------- Three.js scene ---------- */
const cv=document.getElementById('gl'),stage=document.getElementById('stage'),halo=document.getElementById('halo');
const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,50);
const U={t:{value:0},uA:{value:1},uProc:{value:0},uPix:{value:0},uRain:{value:0},uSun:{value:0},uSunY:{value:0},uSpark:{value:0},uSnow:{value:0},uWave:{value:0},uSoft:{value:0},uShake:{value:0},uGlow:{value:1},
 c1:{value:new THREE.Color()},c2:{value:new THREE.Color()},c3:{value:new THREE.Color()},gc:{value:new THREE.Color()}};
const inner=new THREE.Mesh(new THREE.SphereGeometry(.97,96,96),new THREE.ShaderMaterial({uniforms:U,transparent:true,
vertexShader:`varying vec3 vO,vN;void main(){vO=position;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`precision highp float;uniform float t,uA,uProc,uPix,uRain,uSun,uSunY,uSpark,uSnow,uWave,uSoft,uShake,uGlow;uniform vec3 c1,c2,c3,gc;varying vec3 vO,vN;
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){return .5*vn(p)+.25*vn(p*2.03)+.125*vn(p*4.1);}
void main(){
 vec3 n0=normalize(vN),n=n0,o=normalize(vO);float sh=uShake;
 if(uPix>0.){vec2 q=(floor(n0.xy*uPix)+.5)/uPix;n=vec3(q,sqrt(max(0.,1.-dot(q,q))));}
 if(uProc>.01){vec2 g=floor(n0.xy*(26.-uProc*8.));float tt=floor(t*7.);n.xy+=(vec2(h2(g+tt),h2(g+tt+9.))-.5)*.3*uProc;n.xy=(floor(n.xy*20.)+.5)/20.;n.z=sqrt(max(0.,1.-dot(n.xy,n.xy)));}
 float cl=fbm((uPix>0.?vec3(n.xy*2.2,t*.1):o*2.2)+vec3(0.,t*.04,t*.03)+sh*vec3(sin(t*9.),cos(t*7.),0.)*.6);
 float y=n.y*.5+.5;y+=(cl-.4)*.22+uWave*sin(n.y*9.+cl*4.+t*.5)*.035;
 vec3 col=mix(c3,c2,smoothstep(.05,.5,y));col=mix(col,c1,smoothstep(.45,.95,y));
 col+=(c2-c1)*.25*(cl-.4);
 col*=1.+uWave*.13*sin(n.y*18.+cl*5.+t*.7);
 vec3 rb=.5+.5*cos(6.2832*(vec3(0.,.33,.67)+n.x*.35-n.y*.3+t*.08));col=mix(col,rb*(.6+.4*y),uRain);
 float d=length(n.xy-vec2(0.,uSunY));
 col=mix(col,gc,uSun*smoothstep(.3,.25,d));col+=gc*uSun*.35*exp(-d*4.5);
 col+=gc*uGlow*(pow(max(0.,-n.y),7.)*1.3+.25*exp(-length(n.xy-vec2(0.,-1.))*3.));
 for(int i=0;i<2;i++){float fi=float(i);vec2 p=n.xy*(13.+fi*8.);
  vec2 pr=p+vec2(0.,-t*(.7+fi*.4)-sh*3.),ps=p+vec2(sin(t*.5+p.y)*.4,t*(.5+fi*.3));
  float sp=step(.93-sh*.15,h2(floor(pr)))*smoothstep(.35,0.,length(fract(pr)-.5));
  float sn=step(.9-sh*.3,h2(floor(ps)+7.))*smoothstep(.3,0.,length(fract(ps)-.5));
  col+=gc*sp*uSpark*1.6*(1.+sh*2.)+vec3(1.)*sn*uSnow*1.2*(1.+sh*2.);}
 vec3 s3=floor(o*45.);float st=step(.9975,h3(s3))*smoothstep(.35,0.,length(fract(o*45.)-.5));
 col+=vec3(.8,.8,1.)*(uPix>0.?0.:1.)*st*(.6+.4*sin(t*2.+h3(s3)*20.))*1.4*(1.-uSoft*.6);
 col=mix(col,mix(c2,c3,.5),uSoft*.3);
 col*=mix(.5,1.,smoothstep(0.,.6,n0.z));
 if(uPix>0.){vec2 fq=fract(n0.xy*uPix)-.5;col*=mix(.08,1.3,smoothstep(.5,.3,length(fq)));}
 col*=1.+uProc*.25*h2(floor(n0.xy*40.)+floor(t*5.));gl_FragColor=vec4(col,uA);}`}));
scene.add(inner);

function drawBg(t){
 if(!state.img||!app.classList.contains('imgmode'))return;
 const c=bgC,sc=Math.min(devicePixelRatio,2)*.7,W=Math.round(app.clientWidth*sc),H=Math.round(app.clientHeight*sc),PH=H*.75;
 if(c.width!==W||c.height!==H){c.width=W;c.height=H;}

 const x=sceneC.getContext('2d'),im=state.img.im,s=Math.max(W/im.width,PH/im.height),dw=im.width*s,dh=im.height*s,ox=(W-dw)/2,oy=(PH-dh)/2,pts=state.img.pts,n=pts.length,T=state.T;
 state.ap=(state.ap||0)+((state.applied?1:0)-(state.ap||0))*.05;const ap=state.ap,tw0=cur&&cur.sp>.4;
 if(state.scanT0==null)state.scanT0=t;const sw=Math.min(1,(t-state.scanT0)/1.6);
 x.globalCompositeOperation='source-over';x.fillStyle='#0b0618';x.fillRect(0,0,W,H);
 x.save();x.beginPath();x.rect(0,0,W,PH);x.clip();x.drawImage(im,ox,oy,dw,dh);
 x.fillStyle=`rgba(5,3,12,${.3+.3*ap})`;x.fillRect(0,0,W,PH);
 if(ap>.01){const k=cols[0];x.globalCompositeOperation='soft-light';x.fillStyle=`rgba(${k[0]},${k[1]},${k[2]},${.6*ap})`;x.fillRect(0,0,W,PH);}
 x.restore();
 x.globalCompositeOperation='lighter';
 if(ap>.01)pts.forEach((q,i)=>{const X=ox+q.x*dw,Y=oy+q.y*dh,rgb=ledRGB(i,n,T);
  let b=tw0?.3+.7*Math.pow(.5+.5*Math.sin(T*4+i*12.98),2):.78+.22*Math.sin(T*2+i*.9);if(cur&&cur.px)b=Math.round(b*4)/4;b*=ap;
  const rr=Math.max(2.5*sc,q.r*dw*1.3),C=`${rgb[0]|0},${rgb[1]|0},${rgb[2]|0}`;
  let g=x.createRadialGradient(X,Y,0,X,Y,rr*8);g.addColorStop(0,`rgba(${C},${.65*b})`);g.addColorStop(.35,`rgba(${C},${.2*b})`);g.addColorStop(1,`rgba(${C},0)`);x.fillStyle=g;x.beginPath();x.arc(X,Y,rr*8,0,7);x.fill();
  g=x.createRadialGradient(X,Y,0,X,Y,rr*1.7);g.addColorStop(0,`rgba(255,255,255,${b})`);g.addColorStop(.5,`rgba(${C},${.9*b})`);g.addColorStop(1,`rgba(${C},0)`);x.fillStyle=g;x.beginPath();x.arc(X,Y,rr*1.7,0,7);x.fill();});
 x.globalCompositeOperation='source-over';
 if(sw<1){const bh=PH*.35,by=-bh+(PH+bh*2)*sw,g=x.createLinearGradient(0,by-bh,0,by+bh*.25);g.addColorStop(0,'rgba(8,4,24,0)');g.addColorStop(.75,'rgba(8,4,24,.55)');g.addColorStop(1,'rgba(8,4,24,0)');x.fillStyle=g;x.fillRect(0,by-bh,W,bh*1.25);}
 let g2=x.createLinearGradient(0,H*.36,0,H*.72);g2.addColorStop(0,'rgba(11,6,24,0)');g2.addColorStop(.5,'rgba(11,6,24,.4)');g2.addColorStop(1,'rgba(11,6,24,1)');x.fillStyle=g2;x.fillRect(0,H*.36,W,H*.64);
 g2=x.createLinearGradient(0,0,0,H*.14);g2.addColorStop(0,'rgba(8,4,20,.65)');g2.addColorStop(1,'rgba(8,4,20,0)');x.fillStyle=g2;x.fillRect(0,0,W,H*.14);
 g2=x.createRadialGradient(W/2,H*1.05,0,W/2,H*1.05,H*.5);g2.addColorStop(0,'rgba(110,45,230,.42)');g2.addColorStop(1,'rgba(110,45,230,0)');x.fillStyle=g2;x.fillRect(0,H*.5,W,H*.5);
 const m=c.getContext('2d');m.globalCompositeOperation='source-over';m.drawImage(sceneC,0,0);
 /* frosted, reflective glass: blurred + magnified photo inside the sphere */
 const ar=app.getBoundingClientRect(),sr=stage.getBoundingClientRect(),cx=(sr.left-ar.left+sr.width/2)*sc,cy=(sr.top-ar.top+sr.height/2)*sc,r=Math.min(sr.width,sr.height)/2/1.12*sc*.97;
 if(r>8){const sd=r*1.25,tx=tinyC.getContext('2d'),bx=blurC.getContext('2d');
  tx.clearRect(0,0,22,22);tx.drawImage(sceneC,cx-sd/2,cy-sd/2,sd,sd,0,0,22,22);
  bx.clearRect(0,0,72,72);bx.imageSmoothingQuality='high';bx.filter='blur(3px)';bx.drawImage(tinyC,0,0,72,72);bx.filter='none';
  m.save();m.beginPath();m.arc(cx,cy,r,0,7);m.clip();m.imageSmoothingQuality='high';
  m.drawImage(blurC,cx-r,cy-r,r*2,r*2);
  m.save();m.globalAlpha=.3;m.globalCompositeOperation='screen';m.translate(cx,cy);m.rotate(Math.PI);m.drawImage(blurC,-r*.9,-r*.9,r*1.8,r*1.8);m.restore();
  m.fillStyle='rgba(60,40,150,.14)';m.fillRect(cx-r,cy-r,r*2,r*2);
  let h=m.createLinearGradient(cx-r*.8,cy-r*.9,cx+r*.3,cy+r*.2);h.addColorStop(0,'rgba(255,255,255,.22)');h.addColorStop(.45,'rgba(255,255,255,.04)');h.addColorStop(1,'rgba(255,255,255,0)');m.fillStyle=h;m.fillRect(cx-r,cy-r,r*2,r*2);
  h=m.createRadialGradient(cx,cy,r*.55,cx,cy,r);h.addColorStop(0,'rgba(10,6,30,0)');h.addColorStop(1,'rgba(10,6,30,.45)');m.fillStyle=h;m.fillRect(cx-r,cy-r,r*2,r*2);
  m.restore();}
}
